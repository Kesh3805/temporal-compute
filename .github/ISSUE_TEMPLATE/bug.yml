name: Correctness issue
description: Report a runtime, trace or metric discrepancy
labels: [correctness]
body:
  - type: textarea
    attributes:
      label: Reproduction
      description: Include commit, toolchain, scenario, scheduler, seed and command.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
