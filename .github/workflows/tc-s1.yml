name: TC-S1 frozen experiment replay
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
      - run: python scripts/tc_s1.py
      - run: python scripts/tc_s1_verify_results.py results/local/tc-s1
      - run: python scripts/tc_s1_compare_results.py results/tc-s1 results/local/tc-s1
      - uses: actions/upload-artifact@v4
        with:
          name: tc-s1-${{ matrix.os }}
          path: |
            results/local/tc-s1/*.json
            results/local/tc-s1/corpus/
