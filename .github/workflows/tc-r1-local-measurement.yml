name: TC-R1 bounded local measurement
on:
  push:
    branches: [research/tc-r1-local-measurement]
    paths: ['research/tc-r1/local-measurement/execute.json']
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Refuse any attempt but the first introduction of the marker
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test -z "$(git rev-list --full-history 'HEAD^@' -- research/tc-r1/local-measurement/execute.json)"
      - name: Retain runner identity
        run: |
          mkdir -p results/local/tc-r1-local-measurement
          lscpu > results/local/tc-r1-local-measurement/cpu.txt
          free -b > results/local/tc-r1-local-measurement/memory.txt
          df -B1 > results/local/tc-r1-local-measurement/storage.txt
          cmake --version > results/local/tc-r1-local-measurement/toolchain.txt
          c++ --version >> results/local/tc-r1-local-measurement/toolchain.txt
      - name: Install upstream CPU build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build time libgl1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
      - name: Fetch pinned selected substrate
        run: |
          git clone https://github.com/mmp/pbrt-v4.git target/pbrt
          git -C target/pbrt checkout b4ce9687e6c695f5582997c61b0c66cf064bdb4a
          git -C target/pbrt submodule update --init --recursive
          git -C target/pbrt submodule status --recursive > results/local/tc-r1-local-measurement/dependencies.txt
      - name: Reuse unchanged qualified instrumentation
        run: python experiments/tc-r1/e3_instrument.py --source target/pbrt --manifest results/local/tc-r1-local-measurement/instrumentation.json
      - name: Build selected CPU kernel
        shell: bash
        run: |
          set -euo pipefail
          cmake -S target/pbrt -B target/pbrt-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPBRT_FLOAT_AS_DOUBLE=OFF -DPBRT_OPTIX_PATH:PATH= -DPBRT_BUILD_GPU_RENDERER=OFF -DGLFW_BUILD_WAYLAND=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5 > results/local/tc-r1-local-measurement/configure.log 2>&1
          cmake --build target/pbrt-build --target pbrt_exe --parallel 4 > results/local/tc-r1-local-measurement/build.log 2>&1
          cp target/pbrt-build/CMakeCache.txt results/local/tc-r1-local-measurement/CMakeCache.txt
      - name: Bind build provenance
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('results/local/tc-r1-local-measurement')
          value=json.loads((root/'instrumentation.json').read_text())
          value['binary_sha256']=hashlib.sha256(pathlib.Path('target/pbrt-build/pbrt').read_bytes()).hexdigest()
          cache=(root/'CMakeCache.txt').read_text()
          if 'PBRT_FLOAT_AS_DOUBLE:BOOL=OFF' not in cache or 'PBRT_OPTIX_PATH:PATH=\n' not in cache:
              raise ValueError('CPU-float build configuration not verified')
          value['build_flags']='Release; Ninja; CPU; PBRT_FLOAT_AS_DOUBLE=OFF; PBRT_OPTIX_PATH=; GLFW_BUILD_WAYLAND=OFF; parallel=4'
          value['dependency_revisions']=(root/'dependencies.txt').read_text()
          value['toolchain']=(root/'toolchain.txt').read_text()
          (root/'build-manifest.json').write_text(json.dumps(value,indent=2)+'\n')
          PY
      - name: Bounded non-primary measurement
        timeout-minutes: 45
        run: python experiments/tc-r1/local_measurement.py --pbrt target/pbrt-build/pbrt --manifest results/local/tc-r1-local-measurement/build-manifest.json --output results/local/tc-r1-local-measurement/report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tc-r1-local-measurement
          path: results/local/tc-r1-local-measurement
          retention-days: 30
