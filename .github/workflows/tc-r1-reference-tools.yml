name: TC-R1 reference pipeline synthetic tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  reference-tools:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.5.3
      - run: python -m unittest discover -s experiments/tc-r1 -p test_reference_pipeline.py
      - run: python -O -m unittest discover -s experiments/tc-r1 -p test_reference_pipeline.py
