name: TC-R1 worker startup diagnosis (no scientific output)
on:
  push:
    branches: [research/tc-r1-execution-runner]
    paths: ['research/tc-r1/diagnostics/diagnose-*.json']
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tc-r1-validated-binary
          path: target/binary
          run-id: 40164652532
          github-token: ${{ github.token }}
      - name: Runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
      - name: Start the worker by hand for failing and working stream identities
        shell: bash
        run: |
          chmod +x target/binary/bin/pbrt-worker
          python -m pip install numpy==2.4.6
          python - <<'PY'
          import os, subprocess, sys
          sys.path.insert(0, 'experiments/tc-r1')
          from progressive_kernel import stream_seed
          cases = [('uniform-01','f1','reference-b','research/tc-r1/corpus/scenes/uniform-01/f1.pbrt'),
                   ('uniform-01','f1','reference-a','research/tc-r1/corpus/scenes/uniform-01/f1.pbrt'),
                   ('specular-01','f0','reference-a','research/tc-r1/corpus/scenes/specular-01/f0.pbrt')]
          for scene, frame, stream, path in cases:
              seed = stream_seed(scene, frame, 0, stream) & 0x7fffffff
              for extra in ([], ['--spp', str(1 << 30)]):
                  env = {k: v for k, v in os.environ.items() if not k.startswith('TC_R1')}
                  env['TC_R1W_WORKER'] = '1'
                  cmd = ['target/binary/bin/pbrt-worker', '--nthreads', '4', '--seed', str(seed), *extra, '--quiet', path]
                  p = subprocess.run(cmd, env=env, input='', capture_output=True, text=True, timeout=300)
                  print(f'== {scene} {frame} {stream} seed={seed} extra={extra} status={p.returncode}')
                  print('stdout:', p.stdout[-800:])
                  print('stderr:', p.stderr[-1500:])
          PY
          sudo dmesg | tail -20 || true
