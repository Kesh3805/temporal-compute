name: TC-R1 references with an existing validated binary
on:
  push:
    branches: [research/tc-r1-execution-runner]
    paths: ['research/tc-r1/references/level-*.json']
permissions:
  contents: read
  actions: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
      spp: ${{ steps.plan.outputs.spp }}
      frames: ${{ steps.plan.outputs.frames }}
      binary_run: ${{ steps.plan.outputs.binary_run }}
      previous: ${{ steps.plan.outputs.previous }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Missing (frame, stream) pairs for this level
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          marker=$(git diff-tree --no-commit-id --name-only -r HEAD -- 'research/tc-r1/references/level-*.json' | head -1)
          test -n "$marker"
          test -z "$(git rev-list --full-history 'HEAD^@' -- "$marker")"
          python - "$marker" <<'PY' >> "$GITHUB_OUTPUT"
          import json, subprocess, sys
          sys.path.insert(0, 'experiments/tc-r1')
          from pathlib import Path
          from reference_pipeline import corpus_plans
          marker = json.load(open(sys.argv[1]))
          plans = corpus_plans(Path('.'), Path('research/tc-r1/corpus/manifest.json'))['pairs']
          wanted = None if marker['frames'] == 'all' else set(marker['frames'].split(','))
          have = set()
          for run in marker.get('previous_runs', []):
              names = subprocess.check_output(['gh', 'api', '--paginate',
                  f'repos/Kesh3805/temporal-compute/actions/runs/{run}/artifacts', '--jq', '.artifacts[].name'], text=True).split()
              have |= {n for n in names if n.startswith('tc-r1-ref-')}
          include = [dict(index=i, stream=s) for i, p in enumerate(plans)
                     if wanted is None or f"{p['scene_id']}/{p['frame_id']}" in wanted
                     for s in ('reference-a', 'reference-b') if f'tc-r1-ref-{i}-{s}' not in have]
          print('matrix=' + json.dumps(dict(include=include or [dict(index=-1, stream='none')])))
          print(f"any={'true' if include else 'false'}")
          print(f"spp={marker['spp']}")
          print(f"frames={marker['frames']}")
          print(f"binary_run={marker['binary_run']}")
          print(f"previous={' '.join(map(str, marker.get('previous_runs', [])))}")
          print(f'missing pairs: {len(include)}', file=sys.stderr)
          PY

  references:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tc-r1-validated-binary
          path: out
          run-id: ${{ needs.plan.outputs.binary_run }}
          github-token: ${{ github.token }}
      - name: Runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
      - name: Render one reference stream
        run: |
          python -m pip install numpy==2.4.6
          chmod +x out/bin/pbrt-worker
          mkdir -p refs
          lscpu > refs/cpu-${{ matrix.index }}-${{ matrix.stream }}-${{ needs.plan.outputs.spp }}.txt
          python experiments/tc-r1/reference_job.py --binary out/bin/pbrt-worker --manifest out/worker-build-manifest.json --index ${{ matrix.index }} --stream ${{ matrix.stream }} --spp ${{ needs.plan.outputs.spp }} --frames "${{ needs.plan.outputs.frames }}" --output refs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tc-r1-ref-${{ matrix.index }}-${{ matrix.stream }}
          path: refs
          retention-days: 90

  converge:
    needs: [plan, references]
    if: always() && needs.plan.result == 'success' && needs.references.result != 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Gather this level's reference streams from previous and current runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p refs
          for run in ${{ needs.plan.outputs.previous }} ${{ github.run_id }}; do
            for name in $(gh api --paginate repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts --jq '.artifacts[].name' | grep '^tc-r1-ref-' || true); do
              gh run download "$run" -R "$GITHUB_REPOSITORY" -n "$name" -D "dl/$run/$name"
              cp -n dl/$run/$name/* refs/
            done
          done
          ls refs/*.npy | wc -l
      - name: Install pinned CPU metric dependencies and models
        run: |
          python -m pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r experiments/tc-r1/requirements-metrics.txt
          python experiments/tc-r1/prepare_metric_models.py target/metric-models
      - name: Convergence decisions
        run: python experiments/tc-r1/reference_convergence.py --images refs --weights target/metric-models --spp ${{ needs.plan.outputs.spp }} --frames "${{ needs.plan.outputs.frames }}" --output refs/convergence-${{ needs.plan.outputs.spp }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tc-r1-references-converged
          path: refs
          retention-days: 90
