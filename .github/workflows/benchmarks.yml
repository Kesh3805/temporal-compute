name: TC-0 research artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python3 scripts/tc0.py
      - uses: actions/upload-artifact@v4
        with:
          name: tc0-results
          path: results/local/
