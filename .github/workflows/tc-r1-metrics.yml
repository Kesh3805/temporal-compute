name: TC-R1 synthetic metrics
on: [push, pull_request]
permissions:
  contents: read
jobs:
  numeric:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU metric dependencies
        run: |
          python -m pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r experiments/tc-r1/requirements-metrics.txt
      - name: Provision and verify official model weights
        run: python experiments/tc-r1/prepare_metric_models.py target/metric-models
      - name: Known-answer numeric and official-model crosschecks only
        env:
          TC_R1_METRIC_MODELS: target/metric-models
        run: python -m unittest discover -s experiments/tc-r1 -p 'test_*.py'
