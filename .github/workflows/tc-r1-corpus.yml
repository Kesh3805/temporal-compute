name: TC-R1 corpus validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s experiments/tc-r1 -p test_corpus.py
      - run: python -O -m unittest discover -s experiments/tc-r1 -p test_corpus.py
      - run: python experiments/tc-r1/corpus.py
      - run: python scripts/tc_s1_freeze.py
      - run: python scripts/tc_r1_protocol.py
