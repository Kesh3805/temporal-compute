name: TC-R1 integration decision validation
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  decision:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s experiments/tc-r1 -p test_integration_budget.py
      - run: python -O -m unittest discover -s experiments/tc-r1 -p test_integration_budget.py
      - run: python -m unittest discover -s experiments/tc-r1 -p test_native_validation.py
      - run: python -O -m unittest discover -s experiments/tc-r1 -p test_native_validation.py
      - run: python experiments/tc-r1/integration_budget.py
      - run: python scripts/tc_s1_freeze.py
      - run: python scripts/tc_r1_protocol.py
